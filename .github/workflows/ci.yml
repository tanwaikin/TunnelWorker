name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - run: go test -race ./...
      - run: go vet ./...
      - run: python -m pip install -r requirements-smoke.txt
      - run: python scripts/smoke.py --skip-expiry
      - run: npx wrangler deploy --dry-run --outdir=/tmp/tunnelworker-dry-run
